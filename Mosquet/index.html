                    <div class="field full-width">
                        <label for="editTaskNotes">Notas de la solicitud</label>
                        <textarea id="editTaskNotes" name="editTaskNotes" class="custom-input task-notes-input" rows="4" placeholder="Añade contexto, instrucciones o referencias..." autocomplete="off"></textarea>
                    </div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Guardar Edición</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Equipo -->
    <div id="modalTeam" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalTeamTitle">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTeamTitle"><i data-lucide="users" class="icon-primary"></i> Gestión de Equipo</h2>
                <button type="button" class="close-modal" aria-label="Cerrar modal"><i data-lucide="x"></i></button>
            </div>
            <div class="profile-controls">
                <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px;">
                    Contraseña por defecto al añadir: <strong>Nombre_DH2026!</strong>
                </p>
                <form id="addMemberForm" class="input-group">
                    <label for="newMemberInput" class="visually-hidden">Nombre del colaborador</label>
                    <input type="text" id="newMemberInput" name="memberName" class="custom-input" placeholder="Nombre del colaborador..." required>
                    <button type="submit" id="addMemberBtn" class="btn btn-primary">Añadir</button>
                </form>
                <div id="membersList" class="members-tags"></div>
            </div>
        </div>
    </div>

    <!-- Modal Solicitantes -->
    <div id="modalRequesters" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalReqTitle">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalReqTitle"><i data-lucide="building-2" class="icon-primary"></i> Áreas Solicitantes</h2>
                <button type="button" class="close-modal" aria-label="Cerrar modal"><i data-lucide="x"></i></button>
            </div>
            <div class="profile-controls">
                <form id="addRequesterForm" class="input-group">
                    <label for="newRequesterInput" class="visually-hidden">Nombre o área</label>
                    <input type="text" id="newRequesterInput" name="requesterName" class="custom-input" placeholder="Nombre o área..." required>
                    <button type="submit" id="addRequesterBtn" class="btn btn-primary">Añadir</button>
                </form>
                <div id="requestersList" class="members-tags"></div>
            </div>
        </div>
    </div>

    <!-- Modal Mi Perfil -->
    <div id="modalProfile" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modalProfileTitle">
        <div class="modal-content" style="max-width: 480px;">
            <div class="modal-header">
                <h2 id="modalProfileTitle"><i data-lucide="user-cog" class="icon-primary"></i> Personalizar Perfil</h2>
                <button type="button" class="close-modal" id="closeProfileModalBtn" aria-label="Cerrar modal"><i data-lucide="x"></i></button>
            </div>
            <div class="profile-controls">
                
                <div id="avatarPreviewContainer" style="text-align: center; margin-bottom: 10px;">
                    <img id="previewAvatar" src="" alt="Previsualización de avatar" class="user-avatar" style="width: 80px; height: 80px; border-width: 3px;">
                    <div style="margin-top: 8px;">
                        <button type="button" id="btnRemoveAvatar" class="btn-text" style="color: var(--danger); font-size: 0.75rem;">
                            <i data-lucide="trash-2" style="width: 14px; height: 14px;"></i> Eliminar foto
                        </button>
                    </div>
                </div>
                
                <div id="cropperWrapper" style="display: none; width: 100%; max-height: 350px; margin-bottom: 16px; text-align: center; border-radius: 8px; overflow: hidden;">
                    <img id="cropperImage" src="" alt="Recortar imagen" style="max-width: 100%; max-height: 350px; display: block;">
                </div>

                <form id="profileForm" style="display: flex; flex-direction: column; gap: 16px;">
                    
                    <div class="field" style="border-bottom: 1px solid var(--border-light); padding-bottom: 16px;">
                        <span id="colorPickerLabel" style="display:block; font-size:0.8rem; font-weight:600; color:var(--primary-cold); margin-bottom:8px;">Tu color de perfil exclusivo</span>
                        <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; margin-bottom: 12px;">Elige el color con el que verás tus tareas.</p>
                        <div class="color-picker-group" id="colorPickerGroup" role="radiogroup" aria-labelledby="colorPickerLabel">
                            <div class="color-swatch" data-color="#4f46e5" style="background-color: #4f46e5;" role="radio" aria-label="Color #4f46e5" tabindex="0"></div>
                            <div class="color-swatch" data-color="#2563eb" style="background-color: #2563eb;" role="radio" aria-label="Color #2563eb" tabindex="0"></div>
                            <div class="color-swatch" data-color="#0284c7" style="background-color: #0284c7;" role="radio" aria-label="Color #0284c7" tabindex="0"></div>
                            <div class="color-swatch" data-color="#0891b2" style="background-color: #0891b2;" role="radio" aria-label="Color #0891b2" tabindex="0"></div>
                            <div class="color-swatch" data-color="#0d9488" style="background-color: #0d9488;" role="radio" aria-label="Color #0d9488" tabindex="0"></div>
                            <div class="color-swatch" data-color="#059669" style="background-color: #059669;" role="radio" aria-label="Color #059669" tabindex="0"></div>
                            <div class="color-swatch" data-color="#16a34a" style="background-color: #16a34a;" role="radio" aria-label="Color #16a34a" tabindex="0"></div>
                            <div class="color-swatch" data-color="#84cc16" style="background-color: #84cc16;" role="radio" aria-label="Color #84cc16" tabindex="0"></div>
                            <div class="color-swatch" data-color="#f59e0b" style="background-color: #f59e0b;" role="radio" aria-label="Color #f59e0b" tabindex="0"></div>
                            <div class="color-swatch" data-color="#ea580c" style="background-color: #ea580c;" role="radio" aria-label="Color #ea580c" tabindex="0"></div>
                            <div class="color-swatch" data-color="#dc2626" style="background-color: #dc2626;" role="radio" aria-label="Color #dc2626" tabindex="0"></div>
                            <div class="color-swatch" data-color="#e11d48" style="background-color: #e11d48;" role="radio" aria-label="Color #e11d48" tabindex="0"></div>
                            <div class="color-swatch" data-color="#db2777" style="background-color: #db2777;" role="radio" aria-label="Color #db2777" tabindex="0"></div>
                            <div class="color-swatch" data-color="#c026d3" style="background-color: #c026d3;" role="radio" aria-label="Color #c026d3" tabindex="0"></div>
                            <div class="color-swatch" data-color="#7c3aed" style="background-color: #7c3aed;" role="radio" aria-label="Color #7c3aed" tabindex="0"></div>
                        </div>
                    </div>

                    <div class="field" id="fileFieldGroup">
                        <label for="avatarFileInput">Subir foto desde tu PC</label>
                        <input type="file" id="avatarFileInput" name="avatarFile" class="custom-input" accept="image/png, image/jpeg, image/webp">
                    </div>
                    
                    <div id="urlDivider" style="text-align: center; color: var(--text-muted); font-size: 0.8rem; font-weight: 600;">O</div>
                    
                    <div class="field" id="urlFieldGroup">
                        <label for="avatarUrlInput">Usar enlace (URL)</label>
                        <input type="url" id="avatarUrlInput" name="avatarUrl" class="custom-input" placeholder="https://ejemplo.com/mifoto.jpg">
                    </div>

                    <div style="display: flex; gap: 12px; margin-top: 10px;">
                        <button type="button" id="btnCancelCrop" class="btn btn-secondary" style="display: none; flex: 1; justify-content: center;">Cancelar Recorte</button>
                        <button type="submit" id="btnSaveProfile" class="btn btn-primary" style="flex: 2; justify-content: center;">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/es.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
